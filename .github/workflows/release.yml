name: Multi-OS Build & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: LeadPulse-Windows-Setup.exe
            build_script: |
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt pyinstaller
              export PLAYWRIGHT_BROWSERS_PATH=ms-playwright
              python -m playwright install chromium
              echo "SUPABASE_URL=${SUPABASE_URL}" > config.env
              echo "SUPABASE_KEY=${SUPABASE_KEY}" >> config.env
              PLAYWRIGHT_PATH=$(python -c "import os, playwright; print(os.path.join(os.path.dirname(playwright.__file__), 'driver'))")
              python -m PyInstaller --noconfirm --onedir --windowed --icon=icon.ico --add-data "${PLAYWRIGHT_PATH};playwright/driver" --add-data "ms-playwright;ms-playwright" --add-data "assets;assets" --add-data "config.env;." --add-data "icon.png;." --add-data "icon.ico;." --name LeadPulse main.py
              iscc installer.iss
          - os: ubuntu-latest
            asset_name: LeadPulse-Linux-amd64.deb
            build_script: |
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt pyinstaller
              export PLAYWRIGHT_BROWSERS_PATH=ms-playwright
              python -m playwright install --with-deps chromium
              echo "SUPABASE_URL=${SUPABASE_URL}" > config.env
              echo "SUPABASE_KEY=${SUPABASE_KEY}" >> config.env
              PLAYWRIGHT_PATH=$(python -c "import os, playwright; print(os.path.join(os.path.dirname(playwright.__file__), 'driver'))")
              python -m PyInstaller --noconfirm --onedir --windowed --icon=icon.png --add-data "${PLAYWRIGHT_PATH}:playwright/driver" --add-data "ms-playwright:ms-playwright" --add-data "assets:assets" --add-data "config.env:." --add-data "icon.png:." --name LeadPulse main.py
              
              # Build Debian Package (.deb)
              mkdir -p deb_pkg/opt/leadpulse
              mkdir -p deb_pkg/usr/share/applications
              mkdir -p deb_pkg/usr/share/pixmaps
              mkdir -p deb_pkg/DEBIAN
              
              cp -r dist/LeadPulse/* deb_pkg/opt/leadpulse/
              cp icon.png deb_pkg/usr/share/pixmaps/leadpulse.png
              
              cat << 'EOF' > deb_pkg/DEBIAN/control
              Package: leadpulse
              Version: 1.0.0
              Section: utils
              Priority: optional
              Architecture: amd64
              Maintainer: Fixare Studio <contact@fixare.studio>
              Description: LeadPulse Google Maps Extractor
               Industrial Google Maps intelligence scraping software built by Fixare Studio.
              EOF
              
              cat << 'EOF' > deb_pkg/usr/share/applications/leadpulse.desktop
              [Desktop Entry]
              Name=LeadPulse Enterprise
              Comment=Google Maps Lead Generation Tool by Fixare Studio
              Exec=/opt/leadpulse/LeadPulse
              Icon=leadpulse
              Terminal=false
              Type=Application
              Categories=Utility;Development;
              EOF
              
              chmod 755 deb_pkg/DEBIAN/control deb_pkg/usr/share/applications/leadpulse.desktop
              dpkg-deb --build deb_pkg dist/LeadPulse-Linux-amd64.deb
              cd dist && tar -czvf LeadPulse-Linux-x86_64.tar.gz LeadPulse

          - os: macos-latest
            asset_name: LeadPulse-macOS.dmg
            build_script: |
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt pyinstaller
              python -m playwright install chromium
              echo "SUPABASE_URL=${SUPABASE_URL}" > config.env
              echo "SUPABASE_KEY=${SUPABASE_KEY}" >> config.env
              PLAYWRIGHT_PATH=$(python -c "import os, playwright; print(os.path.join(os.path.dirname(playwright.__file__), 'driver'))")
              python -m PyInstaller --noconfirm --windowed --icon=icon.icns --add-data "${PLAYWRIGHT_PATH}:playwright/driver" --add-data "assets:assets" --add-data "config.env:." --add-data "icon.png:." --name LeadPulse main.py
              
              # Build macOS DMG Installer natively
              hdiutil create -volname "LeadPulse Installer" -srcfolder "dist/LeadPulse.app" -ov -format UDZO "dist/LeadPulse-Installer.dmg"
              cd dist && zip -r LeadPulse-macOS.zip LeadPulse.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Executable / Installer
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ${{ matrix.build_script }}

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v1.0.0-latest' || github.ref_name == 'master' && 'v1.0.0-latest' || github.ref_name }}
          name: LeadPulse Enterprise Extractor (${{ github.ref_name }})
          draft: false
          prerelease: false
          files: |
            dist_installer/LeadPulse-Installer-Setup.exe
            dist/LeadPulse-Linux-amd64.deb
            dist/LeadPulse-Linux-x86_64.tar.gz
            dist/LeadPulse-Installer.dmg
            dist/LeadPulse-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
